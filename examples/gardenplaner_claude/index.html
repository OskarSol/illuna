<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GartenPlaner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">

  <!-- Header -->
  <header class="app-header">
    <div class="header-content">
      <div class="header-garden-info">
        <span id="header-icon" class="header-icon">🌿</span>
        <div>
          <div id="header-title" class="header-title">Mein Garten</div>
          <div id="header-location" class="header-location"></div>
        </div>
      </div>
      <div id="current-month-badge" class="header-month-badge"></div>
    </div>
  </header>

  <!-- Tab Navigation -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-view="garten">
      <span class="tab-icon">🏡</span>
      <span class="tab-label">Garten</span>
    </button>
    <button class="tab-btn" data-view="pflanzen">
      <span class="tab-icon">🌱</span>
      <span class="tab-label">Pflanzen</span>
    </button>
    <button class="tab-btn" data-view="planer">
      <span class="tab-icon">📅</span>
      <span class="tab-label">Planer</span>
    </button>
    <button class="tab-btn" data-view="tipps">
      <span class="tab-icon">💡</span>
      <span class="tab-label">Tipps</span>
    </button>
  </nav>

  <!-- Main Content -->
  <main class="main-content">

    <!-- ── Garten View ── -->
    <section id="view-garten" class="view-section active">
      <div class="section-header">
        <h2>Mein Garten</h2>
        <p class="section-sub">Grundinformationen zu deinem Garten</p>
      </div>

      <div class="form-card">

        <div class="form-row icon-title-row">
          <div class="form-field icon-field">
            <label>Symbol</label>
            <button id="garden-icon-btn" class="icon-display-btn" type="button" title="Symbol wählen">
              <span id="garden-icon-display">🌿</span>
            </button>
          </div>
          <div class="form-field flex-1">
            <label for="garden-title-input">Name des Gartens</label>
            <input type="text" id="garden-title-input" placeholder="z.B. Unser Familiengarten" maxlength="50" />
          </div>
        </div>

        <div class="form-field">
          <label for="garden-location-input">📍 Standort / Ort</label>
          <input type="text" id="garden-location-input" placeholder="z.B. Wien, Graz, München …" maxlength="60" />
        </div>

        <div class="form-field">
          <label for="garden-soil-select">🌍 Bodenbeschaffenheit</label>
          <select id="garden-soil-select">
            <option value="Lehmig">Lehmig</option>
            <option value="Sandig">Sandig</option>
            <option value="Tonig">Tonig</option>
            <option value="Humusreich">Humusreich</option>
            <option value="Kalkhaltig">Kalkhaltig</option>
            <option value="Gemischt" selected>Gemischt</option>
          </select>
        </div>

        <div class="form-field">
          <label>🌾 Rasenfläche vorhanden?</label>
          <div class="toggle-row">
            <label class="toggle-switch">
              <input type="checkbox" id="garden-lawn-toggle" checked />
              <span class="toggle-track"></span>
            </label>
            <span id="lawn-label" class="toggle-value-label">Ja ✓</span>
          </div>
        </div>

        <div class="form-field">
          <label for="garden-desc-input">📝 Beschreibung</label>
          <textarea id="garden-desc-input" rows="3" placeholder="Kurze Beschreibung deines Gartens …"></textarea>
        </div>

        <button id="save-garden-btn" class="btn btn-primary btn-full">💾 Speichern</button>
      </div>
    </section>

    <!-- ── Pflanzen View ── -->
    <section id="view-pflanzen" class="view-section">
      <div class="section-header">
        <div class="section-header-row">
          <div>
            <h2>Meine Pflanzen</h2>
            <p class="section-sub">Verwalte deine Pflanzensammlung</p>
          </div>
          <button id="add-plant-btn" class="btn btn-primary btn-sm">+ Pflanze</button>
        </div>
      </div>

      <div class="filter-bar">
        <select id="plants-filter-cat" class="filter-select">
          <option value="alle">Alle Kategorien</option>
          <option value="gemüse">🥬 Gemüse</option>
          <option value="kräuter">🌿 Kräuter</option>
          <option value="obst">🍓 Obst</option>
          <option value="blumen">🌸 Blumen</option>
          <option value="sträucher">🫐 Sträucher</option>
          <option value="bäume">🌳 Bäume</option>
          <option value="sonstiges">🌱 Sonstiges</option>
        </select>
      </div>

      <div id="plants-list"></div>
    </section>

    <!-- ── Planer View ── -->
    <section id="view-planer" class="view-section">
      <div class="section-header">
        <div class="section-header-row">
          <div>
            <h2>Gartenplaner</h2>
            <p class="section-sub">Monatliche Aufgaben & Erinnerungen</p>
          </div>
          <button id="add-reminder-btn" class="btn btn-primary btn-sm">+ Erinnerung</button>
        </div>
      </div>

      <div id="planer-months" class="months-grid"></div>
    </section>

    <!-- ── Tipps View ── -->
    <section id="view-tipps" class="view-section">
      <div class="section-header">
        <h2>Gartentipps</h2>
        <p class="section-sub">Praxistipps für einen erfolgreichen Garten</p>
      </div>
      <div id="tipps-container"></div>
    </section>

  </main>
</div>

<!-- ════════════════ MODALS ════════════════ -->

<!-- Plant Modal -->
<div id="modal-plant" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="plant-modal-title">Neue Pflanze</h3>
      <button id="plant-modal-close" class="modal-close" type="button">✕</button>
    </div>
    <div class="modal-body">
      <form id="plant-form" onsubmit="return false">

        <div class="form-row icon-title-row">
          <div class="form-field icon-field">
            <label>Icon</label>
            <button id="pf-icon-btn" class="icon-display-btn" type="button" title="Symbol wählen">
              <span id="plant-icon-preview">🌱</span>
            </button>
            <input type="hidden" id="pf-icon" />
          </div>
          <div class="form-field flex-1" style="position:relative">
            <label for="pf-name">Pflanzenname *</label>
            <input type="text" id="pf-name" placeholder="z.B. Tomate, Rose, Basilikum …" autocomplete="off" required />
            <div id="plant-suggestions" class="autocomplete-suggestions"></div>
          </div>
        </div>

        <div class="form-field">
          <label for="pf-category">Kategorie</label>
          <select id="pf-category">
            <option value="gemüse">🥬 Gemüse</option>
            <option value="kräuter">🌿 Kräuter</option>
            <option value="obst">🍓 Obst</option>
            <option value="blumen">🌸 Blumen</option>
            <option value="sträucher">🫐 Sträucher</option>
            <option value="bäume">🌳 Bäume</option>
            <option value="sonstiges">🌱 Sonstiges</option>
          </select>
        </div>

        <div class="form-row two-col">
          <div class="form-field">
            <label for="pf-water">💧 Wasserbedarf</label>
            <select id="pf-water">
              <option value="gering">💧 Gering</option>
              <option value="mittel" selected>💧💧 Mittel</option>
              <option value="hoch">💧💧💧 Hoch</option>
            </select>
          </div>
          <div class="form-field">
            <label for="pf-location">Standort</label>
            <select id="pf-location">
              <option value="sonne">☀️ Sonne</option>
              <option value="halbschatten">⛅ Halbschatten</option>
              <option value="schatten">🌑 Schatten</option>
              <option value="kübel">🪴 Kübel</option>
            </select>
          </div>
        </div>

        <div class="form-field">
          <label for="pf-notes">Notizen</label>
          <textarea id="pf-notes" rows="2" placeholder="Eigene Notizen zur Pflanze …"></textarea>
        </div>

      </form>
    </div>
    <div class="modal-footer">
      <button id="plant-cancel-btn" class="btn btn-secondary">Abbrechen</button>
      <button id="plant-save-btn" class="btn btn-primary">Speichern</button>
    </div>
  </div>
</div>

<!-- Reminder Modal -->
<div id="modal-reminder" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3>Erinnerung hinzufügen</h3>
      <button id="reminder-modal-close" class="modal-close" type="button">✕</button>
    </div>
    <div class="modal-body">
      <form id="reminder-form" onsubmit="return false">

        <div class="form-row two-col">
          <div class="form-field">
            <label for="rm-month">Monat</label>
            <select id="rm-month">
              <option value="1">Januar</option>
              <option value="2">Februar</option>
              <option value="3">März</option>
              <option value="4">April</option>
              <option value="5">Mai</option>
              <option value="6">Juni</option>
              <option value="7">Juli</option>
              <option value="8">August</option>
              <option value="9">September</option>
              <option value="10">Oktober</option>
              <option value="11">November</option>
              <option value="12">Dezember</option>
            </select>
          </div>
          <div class="form-field">
            <label for="rm-type">Art</label>
            <select id="rm-type">
              <option value="reminder">🔔 Erinnerung</option>
              <option value="care">🔧 Pflege</option>
              <option value="water">💧 Gießen</option>
              <option value="fertilize">🌿 Düngen</option>
              <option value="sow">🌱 Aussäen</option>
              <option value="plant">🪴 Pflanzen</option>
              <option value="harvest">🧺 Ernten</option>
              <option value="prune">✂️ Schneiden</option>
              <option value="mow">🌾 Rasenmähen</option>
            </select>
          </div>
        </div>

        <div class="form-field">
          <label for="rm-title">Titel *</label>
          <input type="text" id="rm-title" placeholder="z.B. Rosen düngen" required />
        </div>

        <div class="form-field">
          <label for="rm-desc">Beschreibung</label>
          <textarea id="rm-desc" rows="2" placeholder="Optionale Details …"></textarea>
        </div>

      </form>
    </div>
    <div class="modal-footer">
      <button id="reminder-cancel-btn" class="btn btn-secondary">Abbrechen</button>
      <button id="reminder-save-btn" class="btn btn-primary">Speichern</button>
    </div>
  </div>
</div>

<!-- Month Detail Modal -->
<div id="modal-month" class="modal-overlay">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 id="month-modal-title">Monat</h3>
      <button id="month-modal-close" class="modal-close" type="button">✕</button>
    </div>
    <div class="modal-body">
      <div id="month-tasks-list"></div>
    </div>
    <div class="modal-footer">
      <button id="month-add-reminder-btn" class="btn btn-secondary">+ Eigene Erinnerung</button>
      <button id="month-close-btn" class="btn btn-primary">Schließen</button>
    </div>
  </div>
</div>

<!-- Icon Picker -->
<div id="icon-picker" class="modal-overlay">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3>Symbol wählen</h3>
      <button id="icon-picker-close" class="modal-close" type="button">✕</button>
    </div>
    <div class="modal-body">
      <div id="icon-picker-grid" class="icon-picker-grid"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
