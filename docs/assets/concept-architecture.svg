<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Illuna Concept Architecture</title>
  <desc id="desc">Flow from user input to app experience with feedback loop.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#425b76" />
    </marker>
    <style>
      .title { font: 700 44px sans-serif; fill: #1b2b4b; }
      .subtitle { font: 400 23px sans-serif; fill: #54627a; }
      .boxTitle { font: 700 26px sans-serif; fill: #1d2c47; }
      .boxText { font: 400 19px sans-serif; fill: #3f4f67; }
      .line { stroke: #425b76; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #8a97a8; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="70" y="70" class="title">Illuna · Concept Architecture</text>
  <text x="70" y="110" class="subtitle">Natural language signals transformed into controlled, adaptive product behavior.</text>

  <rect x="70" y="170" width="470" height="120" rx="20" fill="#e7f4ff" stroke="#5c7696" stroke-width="3"/>
  <text x="95" y="220" class="boxTitle">User Input</text>
  <text x="95" y="255" class="boxText">Messages · Preferences · Feedback</text>

  <rect x="70" y="340" width="470" height="120" rx="20" fill="#e9f9ef" stroke="#5c7696" stroke-width="3"/>
  <text x="95" y="390" class="boxTitle">Intent Classifier</text>
  <text x="95" y="425" class="boxText">Intent · Entities · Tone · Confidence</text>

  <rect x="70" y="510" width="470" height="120" rx="20" fill="#fff4e4" stroke="#5c7696" stroke-width="3"/>
  <text x="95" y="560" class="boxTitle">Context Engine</text>
  <text x="95" y="595" class="boxText">App State · Session · History · Constraints</text>

  <rect x="70" y="680" width="470" height="120" rx="20" fill="#f2ecff" stroke="#5c7696" stroke-width="3"/>
  <text x="95" y="730" class="boxTitle">Personalization Decision Engine</text>
  <text x="95" y="765" class="boxText">Policy · Memory · Decision Type</text>

  <rect x="690" y="510" width="500" height="120" rx="20" fill="#edf9ff" stroke="#5c7696" stroke-width="3"/>
  <text x="715" y="560" class="boxTitle">Adaptation Layer</text>
  <text x="715" y="595" class="boxText">UI · Tone · Workflow · Feature Visibility</text>

  <rect x="1240" y="510" width="300" height="120" rx="20" fill="#eafff0" stroke="#5c7696" stroke-width="3"/>
  <text x="1265" y="560" class="boxTitle">App Experience</text>
  <text x="1265" y="595" class="boxText">Rendered UX + User Control</text>

  <path class="line" d="M305 290 L305 340"/>
  <path class="line" d="M305 460 L305 510"/>
  <path class="line" d="M305 630 L305 680"/>
  <path class="line" d="M540 740 L690 570"/>
  <path class="line" d="M1190 570 L1240 570"/>

  <path class="loop" d="M1390 630 L1390 900 L600 900 L600 780"/>
  <text x="840" y="935" class="boxText" fill="#6f7d90">Feedback loop: user reactions improve future decisions.</text>
</svg>
